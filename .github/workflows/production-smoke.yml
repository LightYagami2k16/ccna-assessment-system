name: Production smoke test

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test production entry point
        run: npm run test:production
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: |
            playwright-report-production/
            test-results-production/
          if-no-files-found: ignore
          retention-days: 14
